<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETAPMYS - Merkezi Yönetim Sistemi</title>
  <link rel="stylesheet" href="style.css">
  <!-- GSAP Animasyon Kütüphanesi -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>

  <!-- Hero Bölümü -->
  <section class="hero">
    <div class="hero-content">
      <h1 class="animate-title">ETAPMYS</h1>
      <p class="animate-sub">ETAP İşletim Sistemi İçin Gelismis Merkezi Yönetim Çözümü</p>
    </div>
  </section>

  <!-- Tanıtım Bölümü -->
  <section class="details">
    <div class="card animate-card">
      <h2>Akıllı Tahta Yönetimi</h2>
      <p>Okullardaki akıllı tahtaları tek bir merkezden kolayca yönetin, güncelleyin ve kontrol edin.</p>
    </div>
  </section>

  <script src="script.js"></script>

</html>
