<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinema Bilet Sistemi - Ödev Görseli</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .image-container {
            max-width: 95vw;
            max-height: 88vh;
            border: 2px solid #0055ea;
            box-shadow: 4px 4px 15px rgba(0,0,0,0.2);
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            display: block;
        }
        .top-bar {
            width: 100%;
            max-width: 95vw;
            background: linear-gradient(to right, #0055ea, #1e90ff);
            color: white;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
        }
        .close-btn {
            background-color: #ece9d8;
            color: black;
            border: 1px solid #7f9db9;
            width: 22px;
            height: 22px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
        }
        .close-btn:hover {
            background-color: #e81123;
            color: white;
            border-color: #e81123;
        }
    </style>
</head>
<body>

    <div style="width: 100%; max-width: 95vw; display: flex; flex-direction: column; align-items: center;">
        <div class="top-bar">
            <span>Sinema Bilet Sistemi - Ödev Görseli</span>
            <a href="index.html" class="close-btn" title="Kapat / Ana Sayfaya Dön">✕</a>
        </div>
        <div class="image-container">
            <!-- Yükleyeceğin fotoğrafın adı buradadır -->
            <img src="odev-gorsel.png" alt="Ödev Görseli">
        </div>
    </div>

</body>
</html>
