<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVADEON YAZILIM</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #060609;
            --card-bg: rgba(22, 24, 35, 0.55);
            --border-color: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: #cbd5e1;
            
            /* Altın & Parlak Beyaz Katman Paleti */
            --gold-white-gradient: linear-gradient(135deg, #ffffff 0%, #f39c12 50%, #d4af37 100%);
            --accent-glow: rgba(212, 175, 55, 0.15);
            --white-glow: rgba(255, 255, 255, 0.15);
            --card-hover-border: rgba(243, 156, 18, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
            position: relative;
            /* Hafif Teknolojik Arka Plan Izgarası */
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 0),
                linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 40px 40px, 60px 60px, 60px 60px;
        }

        /* ARKA PLAN ORTAM IŞIKLARI (Kısılmış Yumuşak Glow Spheres) */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(140px);
            pointer-events: none;
            z-index: 0;
            animation: floatGlow 12s ease-in-out infinite alternate;
        }

        /* Sol Üstteki Sarı Işık Kısıldı */
        .glow-orb-1 {
            top: -150px;
            left: -150px;
            width: 400px;
            height: 400px;
            background: rgba(212, 175, 55, 0.05);
        }

        .glow-orb-2 {
            bottom: -120px;
            right: -100px;
            width: 550px;
            height: 550px;
            background: rgba(255, 255, 255, 0.06);
            animation-delay: -6s;
        }

        .glow-orb-3 {
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: rgba(243, 156, 18, 0.03);
            animation: pulseCenter 8s ease-in-out infinite alternate;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 50px) scale(1.15); }
        }

        @keyframes pulseCenter {
            0% { opacity: 0.2; transform: translate(-50%, -50%) scale(0.9); }
            100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1.1); }
        }

        /* Hero Section & Entry Animation */
        .hero {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
            position: relative;
            z-index: 1;
        }

        .hero-title {
            font-size: 4.2rem;
            font-weight: 800;
            letter-spacing: 14px;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0;
            transform: translateY(-50px);
            animation: dropDown 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            text-align: center;
            filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.3)) drop-shadow(0 0 35px rgba(212, 175, 55, 0.15));
        }

        @keyframes dropDown {
            0% {
                opacity: 0;
                transform: translateY(-60px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Sections General Styling */
        section {
            min-height: 100vh;
            padding: 100px 10%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-top: 1px solid var(--border-color);
            position: relative;
            z-index: 1;
        }

        .section-title {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: 5px;
            margin-bottom: 50px;
            text-transform: uppercase;
            color: #ffffff;
            text-align: center;
            position: relative;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 3px;
            background: var(--gold-white-gradient);
            margin: 18px auto 0;
            border-radius: 3px;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5), 0 0 20px rgba(255, 255, 255, 0.2);
        }

        /* 1. Biz Kimiz Section (Glassmorphism Effect) */
        .about-content {
            max-width: 850px;
            text-align: center;
            font-size: 1.2rem;
            line-height: 1.9;
            color: var(--text-secondary);
            font-weight: 300;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 45px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .about-content:hover {
            border-color: var(--card-hover-border);
            box-shadow: 0 20px 50px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        /* 2. Misyon, Vizyon, Projeler Section */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            padding: 40px 30px;
            border-radius: 14px;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--gold-white-gradient);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .card:hover {
            border-color: var(--card-hover-border);
            transform: translateY(-10px);
            box-shadow: 0 20px 45px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card h3 {
            font-size: 1.25rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            font-weight: 300;
        }

        /* 3. Çalışanlar Section */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1200px;
            justify-content: center;
        }

        .team-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .team-card:hover {
            border-color: var(--card-hover-border);
            transform: translateY(-6px);
            box-shadow: 0 15px 35px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: #1a1c29;
            border: 2px solid rgba(212, 175, 55, 0.4);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 0.8rem;
            object-fit: cover;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.15);
        }

        .team-info h4 {
            font-size: 1.05rem;
            color: #fff;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .team-info span {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            color: #f39c12;
            background: rgba(243, 156, 18, 0.12);
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid rgba(243, 156, 18, 0.25);
            box-shadow: 0 0 8px rgba(243, 156, 18, 0.1);
        }

        .team-info p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 300;
            line-height: 1.4;
        }

        /* 4. Yönetim Section */
        .leaders-wrapper {
            display: flex;
            gap: 40px;
            justify-content: center;
            width: 100%;
            max-width: 900px;
            flex-wrap: wrap;
        }

        .leader-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            padding: 45px 35px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            min-width: 300px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .leader-card:hover {
            border-color: var(--card-hover-border);
            transform: translateY(-10px);
            box-shadow: 0 20px 45px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .leader-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #1a1c29;
            border: 2px
