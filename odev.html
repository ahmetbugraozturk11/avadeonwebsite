<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ödev Görseli</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            position: relative;
        }
        .image-wrapper {
            position: relative;
            max-width: 98vw;
            max-height: 98vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        img {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            display: block;
        }
        .close-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: 2px solid white;
            width: 36px;
            height: 36px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            border-radius: 50%;
            transition: background-color 0.2s;
            z-index: 999;
        }
        .close-btn:hover {
            background-color: #e81123;
        }
    </style>
</head>
<body>

    <!-- Sağ üst köşedeki çarpı tuşu -->
    <a href="index.html" class="close-btn" title="Kapat">✕</a>

    <!-- Fotoğraf Alanı -->
    <div class="image-wrapper">
        <img src="odev-gorsel.png" alt="Ödev Görseli">
    </div>

</body>
</html>
