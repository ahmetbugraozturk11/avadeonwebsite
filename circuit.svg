<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Koyu Yeşil Glow (LED Parlama Efekti) -->
    <filter id="green-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g stroke="#00ff66" stroke-width="2" fill="none" opacity="0.4" filter="url(#green-glow)">
    <!-- Sert Dönüşlü Devre Yolları -->
    <path d="M 0,100 L 250,100 L 250,300 L 600,300 L 600,150 L 1000,150" />
    <path d="M 100,0 L 100,400 L 350,400 L 350,750 L 800,750 L 800,1000" />
    <path d="M 0,600 L 150,600 L 150,850 L 500,850 L 500,500 L 1000,500" />
    <path d="M 400,0 L 400,200 L 850,200 L 850,600 L 1000,600" />
    <path d="M 700,0 L 700,350 L 900,350 L 900,1000" />
    
    <!-- Baglanti Noktalari (Nodes) -->
    <circle cx="250" cy="100" r="4" fill="#00ff66" />
    <circle cx="250" cy="300" r="4" fill="#00ff66" />
    <circle cx="600" cy="300" r="4" fill="#00ff66" />
    <circle cx="350" cy="400" r="4" fill="#00ff66" />
    <circle cx="150" cy="600" r="4" fill="#00ff66" />
    <circle cx="500" cy="500" r="4" fill="#00ff66" />
    <circle cx="850" cy="200" r="4" fill="#00ff66" />
  </g>
</svg>
